<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstantIoT Server — Admin</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="i18n.js"></script>
</head>
<body x-data="app" x-init="init()" x-cloak>

<!-- ============================================================ -->
<!-- INLINE SVG ICONS                                             -->
<!-- ============================================================ -->

  <defs>

    <symbol id="icon-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
      <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
      <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/>

    </symbol>
    <symbol id="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
    </symbol>
    <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
    </symbol>

      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

      <polyline points="20 6 9 17 4 12"/>

      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>

      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>

</svg>

<!-- ============================================================ -->
<!-- AUTH SCREENS                                                 -->
<!-- ============================================================ -->

<div class="view view-center" x-show="view === 'login'">
  <div class="card login-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('login.subtitle')"></p>
    <form @submit.prevent="login()">
      <input type="text" x-model="loginForm.username" :placeholder="t('login.username')" autocomplete="username" required>
      <input type="password" x-model="loginForm.password" :placeholder="t('login.password')" autocomplete="current-password" required>
      <button type="submit" x-text="t('login.submit')"></button>
      <p class="error" x-text="loginForm.error"></p>
    </form>
    <div class="lang-switch">
      <button class="lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
      <button class="lang-btn" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<div class="view view-center" x-show="view === 'setup'">
  <div class="card login-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('setup.subtitle')"></p>
    <form @submit.prevent="changePassword()">
      <input type="password" x-model="setupForm.current" :placeholder="t('setup.current')" required>
      <input type="password" x-model="setupForm.newPwd" :placeholder="t('setup.new')" required>
      <input type="password" x-model="setupForm.confirm" :placeholder="t('setup.confirm')" required>
      <button type="submit" x-text="t('setup.submit')"></button>
      <p class="error" x-text="setupForm.error"></p>
    </form>
  </div>
</div>

<!-- ============================================================ -->
<!-- APP SHELL                                                    -->
<!-- ============================================================ -->
<div class="app-shell"
     :class="{ 'sidebar-collapsed': sidebarCollapsed, 'mobile-menu-open': mobileMenuOpen }"
     x-show="['dashboard','devices','users','settings','retention','backups'].includes(view)">

  <header class="mobile-topbar">
    <button class="burger-btn" @click="mobileMenuOpen = true" :title="t('a11y.openMenu')" :aria-label="t('a11y.openMenu')">
      <svg class="icon" aria-hidden="true"><use href="#icon-menu"/></svg>
    </button>
    <span class="mobile-topbar-logo">InstantIoT</span>
    <span class="mobile-topbar-spacer"></span>
  </header>

  <div class="drawer-overlay"
       x-show="mobileMenuOpen"
       x-transition.opacity
       @click="mobileMenuOpen = false"
       aria-hidden="true"></div>

  <aside class="sidebar" :class="{ 'mobile-open': mobileMenuOpen }" :aria-label="t('a11y.sidebar')">

    <div class="sidebar-header">
      <span class="sidebar-logo-full">InstantIoT</span>
      <span class="sidebar-logo-mini" aria-hidden="true">I</span>
      <button class="sidebar-mobile-close"
              @click="mobileMenuOpen = false"
              :title="t('a11y.closeMenu')"
              :aria-label="t('a11y.closeMenu')">
        <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" :aria-label="t('a11y.primaryNav')">
      <a href="#" class="sidebar-link" :class="{ active: view === 'dashboard' }"
         @click.prevent="navigate('dashboard'); mobileMenuOpen = false" :title="t('nav.overview')">
        <svg class="sidebar-link-icon" aria-hidden="true"><use href="#icon-overview"/></svg>
        <span class="sidebar-link-label" x-text="t('nav.overview')"></span>
      </a>
      <a href="#" class="sidebar-link" :class="{ active: view === 'devices' }"
         @click.prevent="navigate('devices'); mobileMenuOpen = false" :title="t('nav.devices')">
        <svg class="sidebar-link-icon" aria-hidden="true"><use href="#icon-devices"/></svg>
        <span class="sidebar-link-label" x-text="t('nav.devices')"></span>
      </a>
      <a href="#" class="sidebar-link" :class="{ active: view === 'users' }"
         @click.prevent="navigate('users'); mobileMenuOpen = false" :title="t('nav.users')">
        <svg class="sidebar-link-icon" aria-hidden="true"><use href="#icon-users"/></svg>
        <span class="sidebar-link-label" x-text="t('nav.users')"></span>
      </a>
      <a href="#" class="sidebar-link" :class="{ active: view === 'settings' }"
         @click.prevent="navigate('settings'); mobileMenuOpen = false" :title="t('nav.settings')">
        <svg class="sidebar-link-icon" aria-hidden="true"><use href="#icon-settings"/></svg>
        <span class="sidebar-link-label" x-text="t('nav.settings')"></span>
      </a>
      <a href="#" class="sidebar-link" :class="{ active: view === 'retention' }"
         @click.prevent="navigate('retention'); mobileMenuOpen = false" :title="t('nav.retention')">
        <svg class="sidebar-link-icon" aria-hidden="true"><use href="#icon-clock"/></svg>
        <span class="sidebar-link-label" x-text="t('nav.retention')"></span>
      </a>
      <a href="#" class="sidebar-link" :class="{ active: view === 'backups' }"
         @click.prevent="navigate('backups'); mobileMenuOpen = false" :title="t('nav.backups')">
        <svg class="sidebar-link-icon" aria-hidden="true"><use href="#icon-archive"/></svg>
        <span class="sidebar-link-label" x-text="t('nav.backups')"></span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-row">
        <div class="sidebar-user-avatar" aria-hidden="true">A</div>
        <span class="sidebar-user-name">admin</span>
      </div>

      <div class="sidebar-controls">
        <div class="lang-switch-nav">
          <button class="lang-btn-sm" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
          <button class="lang-btn-sm" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
        </div>
        <button class="theme-toggle"
                @click="toggleTheme()"
                :title="t('a11y.toggleTheme')"
                :aria-label="t('a11y.toggleTheme')">
          <svg class="icon" aria-hidden="true">
            <use :href="effectiveTheme === 'dark' ? '#icon-sun' : '#icon-moon'"/>
          </svg>
        </button>
        <button class="logout-btn"
                @click="logout()"
                :title="t('nav.logout')"
                :aria-label="t('nav.logout')">
          <svg class="icon" aria-hidden="true"><use href="#icon-logout"/></svg>
        </button>
      </div>

      <button class="sidebar-collapse-btn"
              @click="toggleSidebar()"
              :title="sidebarCollapsed ? t('a11y.expandSidebar') : t('a11y.collapseSidebar')"
              :aria-label="sidebarCollapsed ? t('a11y.expandSidebar') : t('a11y.collapseSidebar')">
        <svg class="icon collapse-chevron" aria-hidden="true"><use href="#icon-chevron-left"/></svg>
      </button>
    </div>
  </aside>

  <main class="main-content">

    <!-- OVERVIEW -->
    <div class="page" x-show="view === 'dashboard'">
      <div class="container">
        <div class="page-header">
          <h1 x-text="t('dashboard.title')"></h1>
          <span class="page-header-meta">
            <svg class="icon page-header-icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
            <span x-text="t('dashboard.autoRefresh')"></span>
          </span>
        </div>

        <div class="overview-grid">
          <div class="overview-main">
            <h2 class="section-title">
              <svg class="section-title-icon" aria-hidden="true"><use href="#icon-server"/></svg>
              <span x-text="t('dashboard.serverStatus')"></span>
            </h2>
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-account"/></svg></div>
                <div class="stat-body">
                  <div class="stat-value" x-text="stats.users"></div>
                  <div class="stat-label" x-text="t('stats.accounts')"></div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-folder"/></svg></div>
                <div class="stat-body">
                  <div class="stat-value" x-text="stats.projects"></div>
                  <div class="stat-label" x-text="t('stats.projects')"></div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-cpu"/></svg></div>
                <div class="stat-body">
                  <div class="stat-value" x-text="stats.devicesTotal"></div>
                  <div class="stat-label" x-text="t('stats.devices')"></div>
                </div>
              </div>
              <div class="stat-card accent">
                <div class="stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-wifi"/></svg></div>
                <div class="stat-body">
                  <div class="stat-value" x-text="stats.devicesOnline"></div>
                  <div class="stat-label" x-text="t('stats.online')"></div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-phone"/></svg></div>
                <div class="stat-body">
                  <div class="stat-value" x-text="stats.appSessionsActive"></div>
                  <div class="stat-label" x-text="t('stats.appSessions')"></div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-link"/></svg></div>
                <div class="stat-body">
                  <div class="stat-value" x-text="stats.deviceSessionsActive"></div>
                  <div class="stat-label" x-text="t('stats.tcpConnections')"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="overview-side">
            <h2 class="section-title">
              <svg class="section-title-icon" aria-hidden="true"><use href="#icon-info"/></svg>
              <span x-text="t('info.title')"></span>
            </h2>
            <div class="info-list">
              <div class="info-item">
                <span class="info-label" x-text="t('info.localIp')"></span>
                <span class="info-value" x-text="serverInfo.localIp" x-ref="ipValue"></span>
                <button class="copy-btn" @click="copyText(serverInfo.localIp, $el)" :title="t('a11y.copy')">
                  <svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg>
                </button>
              </div>
              <div class="info-item">
                <span class="info-label">HTTP</span>
                <span class="info-value" x-text="serverInfo.httpPort"></span>
              </div>
              <div class="info-item">
                <span class="info-label">TCP</span>
                <span class="info-value" x-text="serverInfo.tcpPort"></span>
              </div>
              <div class="info-item">
                <span class="info-label" x-text="t('info.uptime')"></span>
                <span class="info-value" x-text="formatUptime(serverInfo.uptimeMs)"></span>
              </div>
              <div class="info-item">
                <span class="info-label">Version</span>
                <span class="info-value" x-text="'v' + serverInfo.version"></span>
              </div>
              <div class="info-item">
                <span class="info-label" x-text="t('info.database')"></span>
                <span class="info-value" x-text="formatBytes(serverInfo.dbSizeBytes)"></span>
              </div>
              <div class="info-item">
                <span class="info-label">Java</span>
                <span class="info-value" x-text="serverInfo.javaVersion"></span>
              </div>
              <div class="info-item">
                <span class="info-label">OS</span>
                <span class="info-value" x-text="serverInfo.osName"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- DEVICES -->
    <div class="page" x-show="view === 'devices'">
      <div class="container">
        <div class="page-header">
          <h1 x-text="t('devices.title')"></h1>
        </div>

        <template x-if="devices.length > 0">
          <div class="card-panel">
            <table class="data-table">
              <thead><tr>
                <th x-text="t('devices.name')"></th>
                <th x-text="t('devices.projectId')"></th>
                <th x-text="t('devices.status')"></th>
                <th x-text="t('devices.lastSeen')"></th>
              </tr></thead>
              <tbody>
              <template x-for="d in devices" :key="d.id">
                <tr>
                  <td :data-label="t('devices.name')" x-text="d.name"></td>
                  <td :data-label="t('devices.projectId')"><code x-text="d.projectId.substring(0, 8) + '...'"></code></td>
                  <td :data-label="t('devices.status')">
                    <span x-show="d.isOnline" class="badge-online" x-text="t('devices.online')"></span>
                    <span x-show="!d.isOnline" class="badge-offline" x-text="t('devices.offline')"></span>
                  </td>
                  <td :data-label="t('devices.lastSeen')" x-text="formatDate(d.lastSeen)"></td>
                </tr>
              </template>
              </tbody>
            </table>
          </div>
        </template>

        <p class="empty-msg" x-show="devices.length === 0" x-text="t('devices.empty')"></p>
      </div>
    </div>

    <!-- USERS -->
    <div class="page" x-show="view === 'users'">
      <div class="container">
        <div class="page-header">
          <h1 x-text="t('users.title')"></h1>
          <p class="page-header-desc" x-text="t('users.intro')"></p>
        </div>

        <!-- Registration toggle — secure-by-default, admin controls the door -->
        <form class="form-card" @submit.prevent="saveRegistrationConfig()">
          <h2 class="section-title" x-text="t('reg.title')"></h2>
          <p class="page-header-desc" x-text="t('reg.intro')"></p>

          <div class="form-row form-row-checkbox">
            <input type="checkbox" id="reg-open" class="form-checkbox"
                   x-model="registrationForm.open"
                   @change="saveRegistrationConfig()">
            <label for="reg-open" class="form-label-inline" x-text="t('reg.open')"></label>
          </div>

          <p class="form-msg"
             :class="registrationForm.open ? 'error' : 'success'"
             x-text="registrationForm.open ? t('reg.statusOpen') : t('reg.statusClosed')"></p>
          <p class="form-msg" :class="registrationForm.msgType"
             x-show="registrationForm.msg" x-text="registrationForm.msg"></p>
        </form>

        <template x-if="users.length > 0">
          <div class="card-panel">
            <table class="data-table">
              <thead><tr>
                <th x-text="t('users.colUsername')"></th>
                <th x-text="t('users.colRole')"></th>
                <th x-text="t('users.colCreated')"></th>
                <th></th>
              </tr></thead>
              <tbody>
              <template x-for="u in users" :key="u.id">
                <tr>
                  <td :data-label="t('users.colUsername')" x-text="u.username"></td>
                  <td :data-label="t('users.colRole')">
                    <span class="badge-online" x-show="u.role === 'admin'" x-text="u.role"></span>
                    <span x-show="u.role !== 'admin'" x-text="u.role"></span>
                  </td>
                  <td :data-label="t('users.colCreated')" x-text="formatDate(u.createdAtMs)"></td>
                  <td class="td-actions">
                    <button class="btn-cancel"
                            @click="askResetUserPassword(u)"
                            x-text="t('users.reset')"></button>
                  </td>
                </tr>
              </template>
              </tbody>
            </table>
          </div>
        </template>

        <p class="empty-msg" x-show="users.length === 0" x-text="t('users.empty')"></p>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="page" x-show="view === 'settings'">
      <div class="container container-narrow">
        <div class="page-header">
          <h1 x-text="t('config.title')"></h1>
          <p class="page-header-desc" x-text="t('settings.intro')"></p>
        </div>

        <form class="form-card" @submit.prevent="saveConfig()">
          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('config.serverName')"></span>
              <span class="form-help" x-text="t('config.serverNameHelp')"></span>
            </label>
            <input type="text" class="form-input"
                   x-model="configForm.serverDisplayName"
                   :placeholder="configForm.effectiveDisplayName || t('config.serverNamePlaceholder')"
                   maxlength="64">
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('config.httpPort')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="configForm.httpPort" min="1" max="65535" required>
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('config.tcpPort')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="configForm.tcpPort" min="1" max="65535" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" x-text="t('config.save')"></button>
            <button type="button" class="btn-danger-outline" @click="restartServer()">
              <svg class="icon" aria-hidden="true"><use href="#icon-power"/></svg>
              <span x-text="t('config.restart')"></span>
            </button>
            <p class="form-msg" :class="configForm.msgType" x-text="configForm.msg"></p>
          </div>
        </form>

        <p class="page-note">
          <svg class="icon" aria-hidden="true"><use href="#icon-alert-triangle"/></svg>
          <span x-text="t('config.restartNote')"></span>
        </p>
      </div>
    </div>

    <!-- DATA RETENTION -->
    <div class="page" x-show="view === 'retention'">
      <div class="container container-narrow">
        <div class="page-header">
          <h1 x-text="t('history.title')"></h1>
          <p class="page-header-desc" x-text="t('history.intro')"></p>
        </div>

        <form class="form-card" @submit.prevent="saveHistoryConfig()">
          <!-- Raw enabled toggle — off by default, on enables tier raw (every sample) -->
          <div class="form-row form-row-checkbox">
            <input type="checkbox" id="history-raw-enabled" class="form-checkbox" x-model="historyForm.rawEnabled">
            <label for="history-raw-enabled" class="form-label-inline" x-text="t('history.rawEnabled')"></label>
          </div>
          <p class="form-help" x-text="t('history.rawEnabledHelp')"></p>

          <!-- Retention raw — only relevant when raw is enabled -->
          <div class="form-row" x-show="historyForm.rawEnabled">
            <label class="form-label">
              <span class="form-label-text" x-text="t('history.retentionRaw')"></span>
              <span class="form-help" x-text="t('history.retentionRawHelp')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="historyForm.retentionRawDays" min="1">
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('history.retentionOpaque')"></span>
              <span class="form-help" x-text="t('history.retentionOpaqueHelp')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="historyForm.retentionOpaqueDays" min="1" required>
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('history.retentionMin')"></span>
              <span class="form-help" x-text="t('history.retentionMinHelp')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="historyForm.retentionMinDays" min="1" required>
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('history.retentionHour')"></span>
              <span class="form-help" x-text="t('history.retentionHourHelp')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="historyForm.retentionHourDays" min="1" required>
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('history.retentionDay')"></span>
              <span class="form-help" x-text="t('history.retentionDayHelp')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="historyForm.retentionDayDays" min="-1" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" x-text="t('history.save')"></button>
            <button type="button" class="btn-cancel" @click="loadHistoryConfig()" x-text="t('history.reset')"></button>
            <p class="form-msg" :class="historyForm.msgType" x-text="historyForm.msg"></p>
          </div>
        </form>

        <p class="page-note">
          <svg class="icon" aria-hidden="true"><use href="#icon-info"/></svg>
          <span x-text="t('history.note')"></span>
        </p>
      </div>
    </div>

    <!-- BACKUPS -->
    <div class="page" x-show="view === 'backups'">
      <div class="container container-narrow">
        <div class="page-header">
          <h1 x-text="t('backup.title')"></h1>
          <p class="page-header-desc" x-text="t('backup.intro')"></p>
        </div>

        <form class="form-card" @submit.prevent="saveBackupConfig()">
          <div class="form-row form-row-checkbox">
            <input type="checkbox" id="backup-enabled" class="form-checkbox" x-model="backupForm.enabled">
            <label for="backup-enabled" class="form-label-inline" x-text="t('backup.enabled')"></label>
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('backup.intervalHours')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="backupForm.intervalHours" min="1" required>
          </div>

          <div class="form-row">
            <label class="form-label">
              <span class="form-label-text" x-text="t('backup.retentionCount')"></span>
            </label>
            <input type="number" class="form-input form-input-num"
                   x-model.number="backupForm.retentionCount" min="1" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" x-text="t('backup.save')"></button>
            <button type="button" class="btn-secondary"
                    @click="backupNow()"
                    :disabled="backupForm.busy">
              <svg class="icon" aria-hidden="true"><use href="#icon-archive"/></svg>
              <span x-text="t('backup.now')"></span>
            </button>
            <p class="form-msg" :class="backupForm.msgType" x-text="backupForm.msg"></p>
          </div>
        </form>

        <div class="backup-meta-row">
          <span class="backup-meta-item">
            <span class="backup-meta-key" x-text="t('backup.lastBackup')"></span>
            <span class="backup-meta-value" x-text="formatBackupDate(backupForm.lastBackupAtMs)"></span>
          </span>
          <span class="backup-meta-item">
            <span class="backup-meta-value backup-meta-strong" x-text="backupForm.backupCount"></span>
            <span class="backup-meta-key" x-text="t('backup.snapshots')"></span>
          </span>
        </div>

        <h3 class="section-title-page" x-show="backupForm.backups.length > 0"
            x-text="t('backup.listTitle')"></h3>

        <div class="card-panel" x-show="backupForm.backups.length > 0">
          <table class="data-table">
            <thead><tr>
              <th x-text="t('backup.colDate')"></th>
              <th x-text="t('backup.colSize')"></th>
              <th></th>
            </tr></thead>
            <tbody>
            <template x-for="(b, idx) in backupForm.backups" :key="b.filename">
              <tr x-show="showAllBackups || idx < 5">
                <td :data-label="t('backup.colDate')">
                  <code x-text="b.filename"></code>
                  <div class="backup-date-sub" x-text="b.createdAtFormatted"></div>
                </td>
                <td :data-label="t('backup.colSize')" x-text="formatBackupSize(b.sizeBytes)"></td>
                <td class="td-actions">
                  <button class="btn-cancel"
                          @click="askRestore(b.filename)"
                          :disabled="backupForm.busy"
                          x-text="t('backup.restore')"></button>
                </td>
              </tr>
            </template>
            </tbody>
          </table>
        </div>

        <div class="show-more-row" x-show="backupForm.backups.length > 5">
          <button class="btn-ghost" @click="showAllBackups = !showAllBackups">
            <svg class="icon show-more-chevron" :class="{ flipped: showAllBackups }" aria-hidden="true">
              <use href="#icon-chevron-down"/>
            </svg>
            <span x-show="!showAllBackups" x-text="t('common.showAll') + ' (' + backupForm.backups.length + ')'"></span>
            <span x-show="showAllBackups" x-text="t('common.showLess')"></span>
          </button>
        </div>

        <p class="page-note">
          <svg class="icon" aria-hidden="true"><use href="#icon-info"/></svg>
          <span x-text="t('backup.dirHint') + ' ' + backupForm.backupDirPath"></span>
        </p>
      </div>
    </div>

  </main>
</div>

<!-- ============================================================ -->
<!-- MODALS                                                       -->
<!-- ============================================================ -->

<div class="modal-overlay" x-show="resetUserForm.targetUser !== null"
     x-transition.opacity @click.self="cancelResetUserPassword()">
  <div class="modal-card">
    <h3 x-text="t('users.resetModalTitle')"></h3>
    <p>
      <span x-text="t('users.resetModalMessage')"></span>
      <code x-show="resetUserForm.targetUser" x-text="resetUserForm.targetUser?.username"></code>
    </p>
    <input type="password" x-model="resetUserForm.newPassword"
           :placeholder="t('users.newPasswordPlaceholder')"
           autocomplete="new-password"
           class="modal-input">
    <p class="error" x-text="resetUserForm.error"></p>
    <p class="config-note" x-text="t('users.resetModalWarning')"></p>
    <div class="modal-actions">
      <button class="btn-cancel" @click="cancelResetUserPassword()"
              :disabled="resetUserForm.busy" x-text="t('restart.cancel')"></button>
      <button class="btn-danger" @click="confirmResetUserPassword()"
              :disabled="resetUserForm.busy" x-text="t('users.resetConfirm')"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" x-show="backupForm.restoreModalFor !== null"
     x-transition.opacity @click.self="cancelRestore()">
  <div class="modal-card">
    <h3 x-text="t('backup.restoreModalTitle')"></h3>
    <p>
      <span x-text="t('backup.restoreModalMessage')"></span>
      <code x-text="backupForm.restoreModalFor"></code>
    </p>
    <p class="config-note" x-text="t('backup.restoreModalWarning')"></p>
    <div class="modal-actions">
      <button class="btn-cancel" @click="cancelRestore()"
              :disabled="backupForm.busy" x-text="t('restart.cancel')"></button>
      <button class="btn-danger" @click="confirmRestore()"
              :disabled="backupForm.busy" x-text="t('backup.restoreConfirm')"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" x-show="showRestartModal" x-transition.opacity @click.self="showRestartModal = false">
  <div class="modal-card">
    <h3 x-text="t('restart.title')"></h3>
    <p x-text="t('restart.message')"></p>
    <div class="modal-actions">
      <button class="btn-cancel" @click="showRestartModal = false" x-text="t('restart.cancel')"></button>
      <button class="btn-danger" @click="confirmRestart()" x-text="t('restart.confirm')"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
