<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstantIoT Server — Admin</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="i18n.js"></script>
</head>
<body x-data="app" x-init="init()" x-cloak>

<!-- ============================================================ -->
<!-- LICENCE                                                      -->
<!-- ============================================================ -->
<div class="view view-center" x-show="view === 'licence'">
  <div class="card login-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('licence.subtitle')"></p>
    <form @submit.prevent="activateLicence()">
      <textarea x-model="licenceForm.key" :placeholder="t('licence.placeholder')" rows="4" required
        style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:monospace; font-size:0.8em; resize:vertical; outline:none;"></textarea>
      <button type="submit" x-text="t('licence.submit')" style="margin-top:12px;"></button>
      <p class="error" x-text="licenceForm.error"></p>
    </form>
    <div class="lang-switch">
      <button class="lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
      <button class="lang-btn" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- WELCOME — V1 first-launch flow                               -->
<!-- ============================================================ -->
<div class="view view-center" x-show="view === 'welcome'">
  <div class="card login-card welcome-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('welcome.subtitle')"></p>

    <!-- Bloc default credentials (lecture seule) -->
    <div class="welcome-defaults">
      <div class="welcome-defaults-title" x-text="t('welcome.defaultsTitle')"></div>
      <div class="welcome-cred-row">
        <span class="welcome-cred-label" x-text="t('welcome.username')"></span>
        <code class="welcome-cred-value">admin</code>
      </div>
      <div class="welcome-cred-row">
        <span class="welcome-cred-label" x-text="t('welcome.password')"></span>
        <code class="welcome-cred-value" x-text="bootstrapLicenceId"></code>
        <button class="copy-btn" @click="copyText(bootstrapLicenceId, $el)" title="Copy">&#128203;</button>
      </div>
      <p class="welcome-defaults-hint" x-text="t('welcome.defaultsHint')"></p>
    </div>

    <!-- Bloc Renew (optionnel) -->
    <div class="welcome-renew">
      <div class="welcome-renew-title" x-text="t('welcome.renewTitle')"></div>
      <input type="text"
             x-model="welcomeForm.username"
             :placeholder="t('welcome.newUsername')"
             autocomplete="username"
             :disabled="welcomeForm.submitting">
      <input type="password"
             x-model="welcomeForm.password"
             :placeholder="t('welcome.newPassword')"
             autocomplete="new-password"
             :disabled="welcomeForm.submitting">

      <div class="welcome-actions">
        <button type="button"
                class="btn-cancel"
                @click="submitWelcome('skip')"
                :disabled="welcomeForm.submitting"
                x-text="t('welcome.skip')"></button>
        <button type="button"
                @click="submitWelcome('renew')"
                :disabled="welcomeForm.submitting"
                x-text="t('welcome.renew')"></button>
      </div>
      <p class="error" x-text="welcomeForm.error"></p>
    </div>

    <div class="lang-switch">
      <button class="lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
      <button class="lang-btn" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- LOGIN                                                        -->
<!-- ============================================================ -->
<div class="view view-center" x-show="view === 'login'">
  <div class="card login-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('login.subtitle')"></p>
    <form @submit.prevent="login()">
      <input type="text" x-model="loginForm.username" :placeholder="t('login.username')" autocomplete="username" required>
      <input type="password" x-model="loginForm.password" :placeholder="t('login.password')" autocomplete="current-password" required>
      <button type="submit" x-text="t('login.submit')"></button>
      <p class="error" x-text="loginForm.error"></p>
    </form>
    <p class="forgot-link">
      <a href="#" @click.prevent="view = 'forgot'" x-text="t('login.forgot')"></a>
    </p>
    <div class="lang-switch">
      <button class="lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
      <button class="lang-btn" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- FORGOT PASSWORD — reset via licence                          -->
<!-- ============================================================ -->
<div class="view view-center" x-show="view === 'forgot'">
  <div class="card login-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('forgot.subtitle')"></p>

    <template x-if="!forgotForm.success">
      <form @submit.prevent="submitForgot()">
        <textarea x-model="forgotForm.key"
                  :placeholder="t('forgot.placeholder')"
                  rows="4" required
                  style="width:100%; padding:12px; background:var(--input-bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:monospace; font-size:0.8em; resize:vertical; outline:none;"></textarea>
        <div class="welcome-actions">
          <button type="button"
                  class="btn-cancel"
                  @click="view = 'login'; forgotForm = { key: '', error: '', success: false }"
                  x-text="t('forgot.back')"></button>
          <button type="submit" x-text="t('forgot.submit')"></button>
        </div>
        <p class="error" x-text="forgotForm.error"></p>
      </form>
    </template>

    <template x-if="forgotForm.success">
      <div>
        <p class="forgot-success" x-text="t('forgot.success')"></p>
        <button @click="view = 'login'; forgotForm = { key: '', error: '', success: false }"
                x-text="t('forgot.backToLogin')"></button>
      </div>
    </template>

    <div class="lang-switch">
      <button class="lang-btn" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
      <button class="lang-btn" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- CHANGE PASSWORD                                              -->
<!-- ============================================================ -->
<div class="view view-center" x-show="view === 'setup'">
  <div class="card login-card">
    <div class="logo">InstantIoT</div>
    <p class="subtitle" x-text="t('setup.subtitle')"></p>
    <form @submit.prevent="changePassword()">
      <input type="password" x-model="setupForm.current" :placeholder="t('setup.current')" required>
      <input type="password" x-model="setupForm.newPwd" :placeholder="t('setup.new')" required>
      <input type="password" x-model="setupForm.confirm" :placeholder="t('setup.confirm')" required>
      <button type="submit" x-text="t('setup.submit')"></button>
      <p class="error" x-text="setupForm.error"></p>
    </form>
  </div>
</div>

<!-- ============================================================ -->
<!-- DASHBOARD                                                    -->
<!-- ============================================================ -->
<div class="view" x-show="view === 'dashboard'">
  <template x-ref="navDashboard">
    <nav>
      <div class="nav-left">
        <span class="nav-logo">InstantIoT</span>
        <a href="#" class="nav-link active" @click.prevent="navigate('dashboard')" x-text="t('nav.overview')"></a>
        <a href="#" class="nav-link" @click.prevent="navigate('devices')" x-text="t('nav.devices')"></a>
      </div>
      <div class="nav-right">
        <span class="nav-user">admin</span>
        <div class="lang-switch-nav">
          <button class="lang-btn-sm" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
          <button class="lang-btn-sm" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
        </div>
        <button class="theme-toggle" @click="toggleTheme()" x-text="themeIcon"></button>
        <a href="#" class="nav-link logout" @click.prevent="logout()" x-text="t('nav.logout')"></a>
      </div>
    </nav>
  </template>

  <nav>
    <div class="nav-left">
      <span class="nav-logo">InstantIoT</span>
      <a href="#" class="nav-link active" @click.prevent="navigate('dashboard')" x-text="t('nav.overview')"></a>
      <a href="#" class="nav-link" @click.prevent="navigate('devices')" x-text="t('nav.devices')"></a>
    </div>
    <div class="nav-right">
      <span class="nav-user">admin</span>
      <div class="lang-switch-nav">
        <button class="lang-btn-sm" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
        <button class="lang-btn-sm" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
      </div>
      <button class="theme-toggle" @click="toggleTheme()" x-text="themeIcon"></button>
      <a href="#" class="nav-link logout" @click.prevent="logout()" x-text="t('nav.logout')"></a>
    </div>
  </nav>

  <div class="container">
    <h1 x-text="t('dashboard.title')"></h1>

    <div class="dashboard-grid">
      <div class="col-main">

        <!-- STATS -->
        <div class="section">
          <h2 class="section-title" x-text="t('dashboard.serverStatus')"></h2>
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" x-text="stats.users"></div><div class="stat-label" x-text="t('stats.accounts')"></div></div>
            <div class="stat-card"><div class="stat-value" x-text="stats.projects"></div><div class="stat-label" x-text="t('stats.projects')"></div></div>
            <div class="stat-card"><div class="stat-value" x-text="stats.devicesTotal"></div><div class="stat-label" x-text="t('stats.devices')"></div></div>
            <div class="stat-card accent"><div class="stat-value" x-text="stats.devicesOnline"></div><div class="stat-label" x-text="t('stats.online')"></div></div>
            <div class="stat-card"><div class="stat-value" x-text="stats.appSessionsActive"></div><div class="stat-label" x-text="t('stats.appSessions')"></div></div>
            <div class="stat-card"><div class="stat-value" x-text="stats.deviceSessionsActive"></div><div class="stat-label" x-text="t('stats.tcpConnections')"></div></div>
          </div>
        </div>

        <!-- CONFIG PORTS -->
        <div class="section">
          <h2 class="section-title" x-text="t('config.title')"></h2>
          <form class="config-form" @submit.prevent="saveConfig()">
            <div class="config-row">
              <label x-text="t('config.httpPort')"></label>
              <input type="number" x-model.number="configForm.httpPort" min="1" max="65535" required>
            </div>
            <div class="config-row">
              <label x-text="t('config.tcpPort')"></label>
              <input type="number" x-model.number="configForm.tcpPort" min="1" max="65535" required>
            </div>
            <div class="config-actions">
              <button type="submit" x-text="t('config.save')"></button>
              <button type="button" class="btn-restart" @click="restartServer()" x-text="t('config.restart')"></button>
              <p class="config-msg" :class="configForm.msgType" x-text="configForm.msg"></p>
            </div>
          </form>
          <p class="config-note" x-text="t('config.restartNote')"></p>
        </div>

        <!-- HISTORY RETENTION / DOWNSAMPLE -->
        <div class="section">
          <h2 class="section-title" x-text="t('history.title')"></h2>
          <p class="config-note" x-text="t('history.intro')"></p>
          <form class="config-form" @submit.prevent="saveHistoryConfig()">

            <div class="config-row">
              <label x-text="t('history.retentionRaw')" :title="t('history.retentionRawHelp')"></label>
              <input type="number" x-model.number="historyForm.retentionRawDays" min="1" required>
            </div>
            <div class="config-row">
              <label x-text="t('history.retentionOpaque')" :title="t('history.retentionOpaqueHelp')"></label>
              <input type="number" x-model.number="historyForm.retentionOpaqueDays" min="1" required>
            </div>
            <div class="config-row">
              <label x-text="t('history.throttle')" :title="t('history.throttleHelp')"></label>
              <input type="number" x-model.number="historyForm.throttleRawIntervalSeconds" min="0" required>
            </div>
            <div class="config-row">
              <label x-text="t('history.retentionMin')" :title="t('history.retentionMinHelp')"></label>
              <input type="number" x-model.number="historyForm.retentionMinDays" min="1" required>
            </div>
            <div class="config-row">
              <label x-text="t('history.retentionHour')" :title="t('history.retentionHourHelp')"></label>
              <input type="number" x-model.number="historyForm.retentionHourDays" min="1" required>
            </div>
            <div class="config-row">
              <label x-text="t('history.retentionDay')" :title="t('history.retentionDayHelp')"></label>
              <input type="number" x-model.number="historyForm.retentionDayDays" min="-1" required>
            </div>
            <div class="config-row">
              <label x-text="t('history.downsampleInterval')" :title="t('history.downsampleIntervalHelp')"></label>
              <input type="number" x-model.number="historyForm.downsampleIntervalMinutes" min="1" required>
            </div>

            <div class="config-actions">
              <button type="submit" x-text="t('history.save')"></button>
              <button type="button" class="btn-cancel" @click="loadHistoryConfig()" x-text="t('history.reset')"></button>
              <p class="config-msg" :class="historyForm.msgType" x-text="historyForm.msg"></p>
            </div>
          </form>
          <p class="config-note" x-text="t('history.note')"></p>
        </div>

        <!-- BACKUP -->
        <div class="section">
          <h2 class="section-title" x-text="t('backup.title')"></h2>
          <p class="config-note" x-text="t('backup.intro')"></p>

          <form class="config-form" @submit.prevent="saveBackupConfig()">
            <div class="config-row">
              <label x-text="t('backup.enabled')"></label>
              <input type="checkbox" x-model="backupForm.enabled">
            </div>
            <div class="config-row">
              <label x-text="t('backup.intervalHours')"></label>
              <input type="number" x-model.number="backupForm.intervalHours" min="1" required>
            </div>
            <div class="config-row">
              <label x-text="t('backup.retentionCount')"></label>
              <input type="number" x-model.number="backupForm.retentionCount" min="1" required>
            </div>
            <div class="config-actions">
              <button type="submit" x-text="t('backup.save')"></button>
              <button type="button" @click="backupNow()"
                      :disabled="backupForm.busy"
                      x-text="t('backup.now')"></button>
              <p class="config-msg" :class="backupForm.msgType" x-text="backupForm.msg"></p>
            </div>
          </form>

          <div class="backup-meta">
            <span x-text="t('backup.lastBackup') + ' ' + formatBackupDate(backupForm.lastBackupAtMs)"></span>
            <span class="backup-meta-sep">•</span>
            <span x-text="backupForm.backupCount + ' ' + t('backup.snapshots')"></span>
          </div>

          <h3 class="backup-list-title" x-show="backupForm.backups.length > 0"
              x-text="t('backup.listTitle')"></h3>
          <table x-show="backupForm.backups.length > 0" class="backup-table">
            <thead><tr>
              <th x-text="t('backup.colDate')"></th>
              <th x-text="t('backup.colSize')"></th>
              <th></th>
            </tr></thead>
            <tbody>
              <template x-for="b in backupForm.backups" :key="b.filename">
                <tr>
                  <td>
                    <code x-text="b.filename"></code>
                    <div class="backup-date-sub" x-text="b.createdAtFormatted"></div>
                  </td>
                  <td x-text="formatBackupSize(b.sizeBytes)"></td>
                  <td>
                    <button class="btn-cancel"
                            @click="askRestore(b.filename)"
                            :disabled="backupForm.busy"
                            x-text="t('backup.restore')"></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>

          <p class="config-note" x-text="t('backup.dirHint') + ' ' + backupForm.backupDirPath"></p>
        </div>

      </div>

      <div class="col-side">

        <!-- SERVER INFO -->
        <div class="section">
          <h2 class="section-title" x-text="t('info.title')"></h2>
          <div class="info-list">
            <div class="info-item">
              <span class="info-label" x-text="t('info.localIp')"></span>
              <span class="info-value" x-text="serverInfo.localIp" x-ref="ipValue"></span>
              <button class="copy-btn" @click="copyText(serverInfo.localIp, $el)">&#128203;</button>
            </div>
            <div class="info-item">
              <span class="info-label">HTTP</span>
              <span class="info-value" x-text="serverInfo.httpPort"></span>
            </div>
            <div class="info-item">
              <span class="info-label">TCP</span>
              <span class="info-value" x-text="serverInfo.tcpPort"></span>
            </div>
            <div class="info-item">
              <span class="info-label" x-text="t('info.uptime')"></span>
              <span class="info-value" x-text="formatUptime(serverInfo.uptimeMs)"></span>
            </div>
            <div class="info-item">
              <span class="info-label">Version</span>
              <span class="info-value" x-text="'v' + serverInfo.version"></span>
            </div>
            <div class="info-item">
              <span class="info-label" x-text="t('info.database')"></span>
              <span class="info-value" x-text="formatBytes(serverInfo.dbSizeBytes)"></span>
            </div>
            <div class="info-item">
              <span class="info-label">Java</span>
              <span class="info-value" x-text="serverInfo.javaVersion"></span>
            </div>
            <div class="info-item">
              <span class="info-label">OS</span>
              <span class="info-value" x-text="serverInfo.osName"></span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <p class="refresh-info" x-text="t('dashboard.autoRefresh')"></p>
  </div>
</div>

<!-- ============================================================ -->
<!-- DEVICES                                                      -->
<!-- ============================================================ -->
<div class="view" x-show="view === 'devices'">
  <nav>
    <div class="nav-left">
      <span class="nav-logo">InstantIoT</span>
      <a href="#" class="nav-link" @click.prevent="navigate('dashboard')" x-text="t('nav.overview')"></a>
      <a href="#" class="nav-link active" @click.prevent="navigate('devices')" x-text="t('nav.devices')"></a>
    </div>
    <div class="nav-right">
      <span class="nav-user">admin</span>
      <div class="lang-switch-nav">
        <button class="lang-btn-sm" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button>
        <button class="lang-btn-sm" :class="{ active: lang === 'fr' }" @click="setLang('fr')">FR</button>
      </div>
      <button class="theme-toggle" @click="toggleTheme()" x-text="themeIcon"></button>
      <a href="#" class="nav-link logout" @click.prevent="logout()" x-text="t('nav.logout')"></a>
    </div>
  </nav>

  <div class="container">
    <h1 x-text="t('devices.title')"></h1>

    <template x-if="devices.length > 0">
      <table>
        <thead><tr>
          <th x-text="t('devices.name')"></th>
          <th x-text="t('devices.projectId')"></th>
          <th x-text="t('devices.status')"></th>
          <th x-text="t('devices.lastSeen')"></th>
        </tr></thead>
        <tbody>
          <template x-for="d in devices" :key="d.id">
            <tr>
              <td x-text="d.name"></td>
              <td><code x-text="d.projectId.substring(0, 8) + '...'"></code></td>
              <td>
                <span x-show="d.isOnline" class="badge-online" x-text="t('devices.online')"></span>
                <span x-show="!d.isOnline" class="badge-offline" x-text="t('devices.offline')"></span>
              </td>
              <td x-text="formatDate(d.lastSeen)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>

    <p class="empty-msg" x-show="devices.length === 0" x-text="t('devices.empty')"></p>
  </div>
</div>

<!-- ============================================================ -->
<!-- RESTORE BACKUP CONFIRM MODAL                                 -->
<!-- ============================================================ -->
<div class="modal-overlay" x-show="backupForm.restoreModalFor !== null"
     x-transition.opacity @click.self="cancelRestore()">
  <div class="modal-card">
    <h3 x-text="t('backup.restoreModalTitle')"></h3>
    <p>
      <span x-text="t('backup.restoreModalMessage')"></span>
      <code x-text="backupForm.restoreModalFor"></code>
    </p>
    <p class="config-note" x-text="t('backup.restoreModalWarning')"></p>
    <div class="modal-actions">
      <button class="btn-cancel" @click="cancelRestore()"
              :disabled="backupForm.busy" x-text="t('restart.cancel')"></button>
      <button class="btn-danger" @click="confirmRestore()"
              :disabled="backupForm.busy" x-text="t('backup.restoreConfirm')"></button>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- RESTART CONFIRM MODAL                                        -->
<!-- ============================================================ -->
<div class="modal-overlay" x-show="showRestartModal" x-transition.opacity @click.self="showRestartModal = false">
  <div class="modal-card">
    <h3 x-text="t('restart.title')"></h3>
    <p x-text="t('restart.message')"></p>
    <div class="modal-actions">
      <button class="btn-cancel" @click="showRestartModal = false" x-text="t('restart.cancel')"></button>
      <button class="btn-danger" @click="confirmRestart()" x-text="t('restart.confirm')"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
