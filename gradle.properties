kotlin.code.style=official

# JDK toolchain : Java 21 (LTS)
# ─────────────────────────────────────────────────────────────────
# On NE hardcode PAS `org.gradle.java.home` ici — ça casse les
# builds cross-platform (Mac, Pi, GitHub Actions runners).
#
# Pour pointer vers une JVM spécifique :
#  - Mac (Apple Silicon) :
#      export JAVA_HOME=$(brew --prefix openjdk@21)/libexec/openjdk.jdk/Contents/Home
#  - Linux / Pi :
#      export JAVA_HOME=$(readlink -f $(which javac) | sed 's|/bin/javac||')
#      (typiquement /usr/lib/jvm/java-21-openjdk-arm64)
#
# Sinon Gradle utilise sa propre auto-discovery via la convention
# `jvmToolchain(21)` déclarée dans build.gradle.kts.
#
# ⚠️ JDK 26 casse la compilation Kotlin (IllegalArgumentException
# dans JavaVersion.parse). Si tu as JDK 26 comme JVM par défaut
# (ex: SDKMAN, fnm-java), set JAVA_HOME explicitement avant le build.
