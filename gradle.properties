kotlin.code.style=official

# JDK 26 casse la compilation Kotlin (IllegalArgumentException: 26 dans
# JavaVersion.parse). On force Gradle sur le JDK 21 (LTS), aligné sur
# jvmToolchain(21) du build. Le JDK 21 est dispo via Homebrew :
#   brew install openjdk@21
# (Le path ci-dessous est le keg-only de brew sur Apple Silicon.)
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
